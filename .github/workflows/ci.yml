name: CI

on:
  push:
    branches: [main, feat/commercial-indicators-phase2-4]
  pull_request:
    branches: [main, feat/commercial-indicators-phase2-4]

jobs:
  test:
    name: Validate Pine Script v6 Strategy Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install numpy
      - name: Run Comprehensive Commercial Suite Tests
        run: python3 -m unittest discover tests/
      - name: Run Research Harness & Protocol Tests
        run: python3 -m unittest discover research/backtest/tests/

